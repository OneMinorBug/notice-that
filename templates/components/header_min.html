<header class="ui inverted vertical segment m-padded-tb0">
	<nav class="ui container m-padded-tb-tiny">
		<div class="ui large secondary inverted menu">
			<a class="toc item m-pd-small">
				<i class="sidebar icon"></i>
			</a>
			<a class="item m-pd-small" href="{% url 'problems:home' %}">
				<img class="ui small image" id="logo" src={% static 'images/logo.png' %} alt="NoticeThat">
			</a>
			<div class="right item">
				{% if user.is_authenticated %}
					<a href="{% url 'profiles:profile' %}" class="profile-link">
						<img class="ui avatar image" src="{{ user.profile.profile_picture.url }}" onerror="this.onerror=null;this.src='{% static 'images/default_profile.png' %}';">
					</a>
					&nbsp;&nbsp;&nbsp;
					<a class="ui inverted button" href="{% url 'account_logout' %}">Log Out</a>
				{% else %}
					<a class="ui inverted button m-padded-lr-mini" href="{% url 'account_login' %}">Log In</a>
					<a class="ui secondary button m-padded-lr-mini" href="{% url 'account_signup' %}">Sign Up</a>
				{% endif %}
			</div>
		</div>
	</nav>
</header>
