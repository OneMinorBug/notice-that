<header class="ui inverted vertical center aligned segment m-padded-tb-mini">
	<nav class="ui header container">
		<div class="ui large secondary inverted pointing menu">
			<a class="toc item m-pd-small">
				<i class="sidebar icon"></i>
			</a>
			<a class="item m-pd-mini" href="{% url 'problems:home' %}">
				<img class="ui small image" id="logo" src={% static 'images/logo.png' %}>
			</a>
			<a class="{% if request.path == '/home/' %}active {% endif %}item" href="{% url 'problems:home' %}"><i class="home icon"></i>Home</a>
			<a class="{% if request.path == '/about/' %}active {% endif %}item" href="{% url 'problems:about' %}"><i class="users icon"></i>About</a>
			<a class="{% if request.path == '/contact/' %}active {% endif %}item" href="{% url 'problems:contact' %}"><i class="envelope outline icon"></i>Contact</a>
			<a class="{% if request.path == '/archives/' %}active {% endif %}item" href="{% url 'problems:archives' %}"><i class="save icon"></i>Archives</a>
			{% if user.is_staff %}
				<a class="item" href="{% url 'problems:post_problem' %}"><i class="cloud upload icon"></i>Post Problem</a>
			{% endif %}
			<div class="right item">
				{% if user.is_authenticated %}
					<a href="{% url 'profiles:profile' %}" class="profile-link">
						<img class="ui avatar image" src="{{ user.profile.profile_picture.url }}" onerror="this.onerror=null;this.src='{% static 'images/default_profile.png' %}';">
					</a>
					&nbsp;&nbsp;&nbsp;
					<a class="ui inverted button" href="{% url 'accounts:logout' %}">Logout</a>
				{% else %}
					<a class="ui inverted button" href="{% url 'accounts:login' %}">Login/Sign Up</a>
				{% endif %}
			</div>
		</div>
	</nav>
</header>
