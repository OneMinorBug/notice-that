<header class="ui inverted vertical segment m-pd-tb0">
	<nav class="ui container m-pd-tb-tiny">
		<div class="ui large secondary inverted menu">
			<a class="toc item">
				<i class="sidebar icon"></i>
			</a>
			<a class="item" href="{% url 'problems:home' %}">
				<img class="ui small image" id="logo" src={% static 'images/logo.png' %} alt="NoticeThat">
			</a>
			<a class="item" href="{% url 'problems:home' %}"><i class="home icon"></i>Home</a>
			{% if not user.is_authenticated %}
				<a class="item" href="{% url 'problems:about' %}"><i class="users icon"></i>About</a>
				<a class="item" href="{% url 'problems:contact' %}"><i class="envelope outline icon"></i>Contact</a>
			{% endif %}
			<a class="item" href="{% url 'problems:archives' %}"><i class="save icon"></i>Archives</a>
			{% if user.is_staff %}
			<div class="ui simple dropdown item">
				<i class="cog icon"></i> Control <i class="dropdown icon"></i>
				<div class="menu">
					<a class="item" href="{% url 'problems:post_problem' %}"><i class="plus icon"></i>New Problem</a>
					<a class="item" href="{% url 'problems:post_problem' %}"><i class="edit icon"></i>Edit Problem</a>
				</div>
			</div>
			{% endif %}
			<div class="right item">
				{% if user.is_authenticated %}
					<a href="{% url 'profiles:profile' %}" class="profile-link">
						<img class="ui avatar image" src="{{ user.profile.profile_picture.url }}" onerror="this.onerror=null;this.src='{% static 'images/default_profile.png' %}';">
					</a>
					&nbsp;&nbsp;&nbsp;
					<a class="ui inverted button" href="{% url 'account_logout' %}">Log Out</a>
				{% else %}
					<a class="ui inverted button" href="{% url 'account_login' %}">Log In</a>
					<a class="ui secondary button" href="{% url 'account_signup' %}">Sign Up</a>
				{% endif %}
			</div>
		</div>
	</nav>
</header>
